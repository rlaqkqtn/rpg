<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신의 은총 — 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0b0d14;
    --bg-panel:#12141f;
    --bg-panel-2:#191c2b;
    --gold:#d4af37;
    --gold-dim:#7a6a2e;
    --celestial:#6e8fb8;
    --earth:#a97d4a;
    --abyss:#8a3a3a;
    --parchment:#e8e2d0;
    --parchment-dim:#8b8778;
    --danger:#c65a5a;
    --ok:#6fae7a;
    --line:#2a2d3d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #1b2036 0%, var(--bg-void) 55%),
      var(--bg-void);
    color:var(--parchment);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  h1,h2,h3,.display{
    font-family:'Noto Serif KR', serif;
    letter-spacing:0.02em;
  }
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{ width:100%; max-width:1040px; }

  /* ---------- Title ---------- */
  .title-screen{
    min-height:70vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap:28px;
  }
  .title-screen .eyebrow{
    color:var(--gold); letter-spacing:0.35em; font-size:12px; text-transform:uppercase;
  }
  .title-screen h1{
    font-size:clamp(36px,7vw,64px); font-weight:900; margin:0;
    background:linear-gradient(180deg,#fff6da,var(--gold) 60%, var(--gold-dim));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .title-screen p{ color:var(--parchment-dim); max-width:460px; line-height:1.7; margin:0;}
  .btn{
    appearance:none; border:1px solid var(--gold-dim); background:var(--bg-panel-2);
    color:var(--parchment); font-family:'Noto Serif KR',serif; font-weight:600;
    padding:12px 28px; border-radius:999px; cursor:pointer; font-size:15px;
    transition:all .15s ease; letter-spacing:0.03em;
  }
  .btn:hover{ border-color:var(--gold); background:#20233a; transform:translateY(-1px);}
  .btn:active{ transform:translateY(0); }
  .btn.primary{ background:linear-gradient(180deg,#e8c766,var(--gold)); color:#1b1503; border:none; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.danger{ border-color:#5c2a2a; }
  .btn.danger:hover{ border-color:var(--danger); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; transform:none; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  /* ---------- Layout ---------- */
  .layout{ display:grid; grid-template-columns: 300px 1fr; gap:20px; }
  @media (max-width: 860px){ .layout{ grid-template-columns:1fr; } }

  .panel{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px;
  }
  .panel + .panel{ margin-top:16px; }
  .panel-title{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);
    margin:0 0 12px;
  }

  /* ---------- Triangle map ---------- */
  .map-wrap svg{ width:100%; height:auto; display:block; }
  .node-label{ font-family:'Noto Serif KR',serif; font-size:13px; fill:var(--parchment); }
  .node-sub{ font-family:'JetBrains Mono',monospace; font-size:9px; fill:var(--parchment-dim); }

  /* ---------- Stat bars ---------- */
  .stat-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:12px; }
  .stat-row .label{ width:44px; color:var(--parchment-dim); flex-shrink:0; }
  .bar{ flex:1; height:8px; background:#20222f; border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .bar > div{ height:100%; border-radius:99px; transition:width .3s ease; }
  .bar.hp > div{ background:linear-gradient(90deg,#6fae7a,#9fd6a8); }
  .bar.enemy > div{ background:linear-gradient(90deg,#c65a5a,#e08787); }
  .bar.shield > div{ background:linear-gradient(90deg,#6e8fb8,#a9c3e0); }
  .bar.progress > div{ background:linear-gradient(90deg,var(--gold-dim),var(--gold)); }
  .stat-num{ width:56px; text-align:right; color:var(--parchment-dim); font-size:11px; }

  /* ---------- Keys ---------- */
  .key-row{ display:flex; gap:8px; margin-top:6px; }
  .key-chip{
    width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:#181a26; font-size:14px; color:var(--parchment-dim);
  }
  .key-chip.on{ border-color:var(--gold); background:radial-gradient(circle,#4a3d14,#191c2b); color:var(--gold); }

  /* ---------- Job slots ---------- */
  .slots{ display:flex; gap:10px; flex-wrap:wrap; }
  .slot{
    flex:1; min-width:120px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--bg-panel-2); padding:10px; cursor:pointer; text-align:left;
  }
  .slot.active{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .slot.empty{ opacity:.4; cursor:default; }
  .slot .name{ font-family:'Noto Serif KR',serif; font-size:13px; font-weight:600; }
  .slot .region-tag{ font-size:10px; color:var(--parchment-dim); margin-top:2px; }
  .slot .active-tag{ font-size:10px; color:var(--gold); margin-top:4px; }

  .skills{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .skill-btn{
    text-align:left; border:1px solid var(--line); background:var(--bg-panel-2);
    border-radius:8px; padding:10px 12px; cursor:pointer; color:var(--parchment);
  }
  .skill-btn:hover{ border-color:var(--gold); }
  .skill-btn .sk-name{ font-weight:700; font-size:13px; }
  .skill-btn .sk-type{ font-size:10px; color:var(--gold); margin-left:6px; text-transform:uppercase; letter-spacing:.06em; }
  .skill-btn .sk-desc{ font-size:11px; color:var(--parchment-dim); margin-top:3px; line-height:1.5; }

  /* ---------- Log ---------- */
  .log{
    background:#0f1119; border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; height:180px; overflow-y:auto; font-size:12.5px; line-height:1.8;
    color:var(--parchment-dim);
  }
  .log p{ margin:0 0 6px; }
  .log .sys{ color:var(--gold); }
  .log .dmg{ color:var(--danger); }
  .log .heal{ color:var(--ok); }

  /* ---------- Job pool ---------- */
  .job-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .job-card{
    border:1px solid var(--line); border-radius:var(--radius); padding:12px; background:var(--bg-panel-2);
  }
  .job-card.hidden-job{ border-style:dashed; border-color:var(--gold-dim); }
  .job-card .jc-title{ font-family:'Noto Serif KR',serif; font-weight:700; font-size:14px; }
  .job-card .jc-tag{ font-size:10px; color:var(--parchment-dim); margin-bottom:8px; }
  .job-card ul{ margin:0; padding-left:16px; font-size:11.5px; color:var(--parchment-dim); line-height:1.6; }

  .narrative{ font-size:14px; line-height:1.9; color:var(--parchment); }
  .region-title{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px;}
  .region-title h2{ margin:0; font-size:22px; }
  .region-title .tag{ font-size:11px; color:var(--parchment-dim); }

  .badge{
    display:inline-block; font-size:10px; padding:3px 9px; border-radius:99px; border:1px solid var(--line);
    color:var(--parchment-dim); margin-right:6px;
  }
  .badge.gold{ border-color:var(--gold); color:var(--gold); }

  hr.rule{ border:none; border-top:1px solid var(--line); margin:16px 0; }

  footer{ text-align:center; color:var(--parchment-dim); font-size:11px; margin-top:36px; letter-spacing:.05em;}
</style>
</head>

/* ---------------------------- 게임 상태 ---------------------------- */

const REGIONS = ['천상','지상','지하'];

let S = {
  screen:'title', // title, intro, main, battle, shrine, finalboss, ending
  spawnRegion:null,
  visitOrder:[],
  currentRegion:null,
  stepIndex:0,
  keys:[], // list of region names whose key obtained
  learned:{}, // jobId -> true
  slots:[null,null,null],
  activeSlot:0,
  player:{hp:100, maxHp:100, shield:0},
  battle:null,
  travelChoicePending:false,
  log:[],
  ending:false,
};

function maxSlots(){ return Math.min(3, S.keys.length+1); }

function pushLog(html, cls){
  S.log.push({html, cls: cls||''});
  if(S.log.length>60) S.log.shift();
}

/* ---------------------------- 흐름 제어 ---------------------------- */

function startGame(){
  S.spawnRegion = REGIONS[Math.floor(Math.random()*3)];
  S.currentRegion = S.spawnRegion;
  S.visitOrder = [S.spawnRegion];
  S.screen='intro';
  render();
}

function enterMain(){
  S.screen='main';
  S.stepIndex=0;
  pushLog(`<span class="sys">◆ ${S.currentRegion}에서 눈을 뜨다.</span>`);
  render();
}

function doExplore(){
  const region = S.currentRegion;
  const steps = EXPLORE_STEPS[region];
  if(S.stepIndex >= steps.length) return;
  const step = steps[S.stepIndex];
  pushLog(step.text);

  if(step.learn && !S.learned[step.learn]){
    S.learned[step.learn]=true;
    pushLog(`<span class="sys">◆ 「${step.learn}」의 방식을 익혔다. (직업 습득)</span>`);
    autoEquipIfEmpty(step.learn);
  }
  if(step.shrineGlimpse){
    pushLog(`<span class="sys">◆ 세 세계의 무게중심 — 아주 오래된 신전의 존재를 직감한다. 저곳에 가려면 「신의 은총」의 힘이 필요하다.</span>`);
  }

  S.stepIndex++;

  if(step.keyStep){
    obtainKey(region);
  } else if(step.battle && Math.random()<0.85){
    startBattle(region);
    return;
  }
  render();
}

function autoEquipIfEmpty(jobId){
  const emptyIdx = S.slots.findIndex((s,i)=> s===null && i<maxSlots());
  if(emptyIdx>=0){ S.slots[emptyIdx]=jobId; }
}

function searchHidden(){
  const region = S.currentRegion;
  const pool = HIDDEN_JOBS.filter(h=>h.region===region && !S.learned[h.id]);
  if(pool.length===0){
    pushLog('이 지역에서 더 찾을 수 있는 숨겨진 흔적은 없는 듯하다.');
    render(); return;
  }
  if(Math.random() < 0.35){
    const found = pool[Math.floor(Math.random()*pool.length)];
    S.learned[found.id]=true;
    pushLog(`<span class="sys">◆ 아무도 모르는 흔적을 따라가다, 히든 직업 「${found.id}」를 발견했다!</span>`);
    autoEquipIfEmpty(found.id);
  } else {
    pushLog(HIDDEN_SEARCH_FLAVOR[Math.floor(Math.random()*HIDDEN_SEARCH_FLAVOR.length)]);
  }
  if(Math.random()<0.2){ startBattle(region); return; }
  render();
}

function obtainKey(region){
  S.keys.push(region);
  pushLog(`<span class="sys">✦ ${KEY_FOUND_TEXT[region]}</span>`);
  pushLog(`<span class="sys">✦ 「신의 은총」 파편 ${S.keys.length}/3 확보. 전투 직업 슬롯이 ${maxSlots()}개로 늘어났다.</span>`);

  if(S.keys.length>=3){
    S.screen='shrine';
    return;
  }
  const remaining = REGIONS.filter(r=>!S.visitOrder.includes(r));
  if(remaining.length===1){
    // 자동 이동
    travelTo(remaining[0]);
  } else {
    S.travelChoicePending = true;
  }
}

function travelTo(region){
  S.currentRegion = region;
  S.visitOrder.push(region);
  S.travelChoicePending=false;
  S.stepIndex=0;
  pushLog(`<span class="sys">◆ 신의 은총이 이끄는 힘을 따라 ${region}(으)로 넘어간다.</span>`);
  render();
}

/* ---------------------------- 전투 ---------------------------- */

function startBattle(region){
  const name = ENEMY_POOL[region][Math.floor(Math.random()*ENEMY_POOL[region].length)];
  S.battle = {
    enemyName:name, hp:60, maxHp:60, atk:[8,14], stunned:false, atkDown:0,
  };
  S.screen='battle';
  pushLog(`<span class="dmg">⚔ ${name}과(와) 마주쳤다!</span>`);
  render();
}

function activeJob(){
  const id = S.slots[S.activeSlot];
  return id ? jobById(id) : null;
}

function useSkill(skill){
  if(!S.battle) return;
  const b = S.battle;
  let msg = `<b>${skill.name}</b> 사용 — `;
  switch(skill.type){
    case '딜': {
      const dmg = 14 + Math.floor(Math.random()*10);
      b.hp = Math.max(0,b.hp-dmg);
      msg += `<span class="dmg">${b.enemyName}에게 ${dmg} 피해!</span>`;
      break;
    }
    case '버프': {
      const shield = 12;
      S.player.shield += shield;
      msg += `<span class="heal">보호막 +${shield}</span>`;
      break;
    }
    case '디버프': {
      b.atkDown = 2;
      msg += `${b.enemyName}의 공격력이 일시적으로 약화되었다.`;
      break;
    }
    case '제어': {
      b.stunned = true;
      msg += `${b.enemyName}의 다음 행동을 봉쇄했다.`;
      break;
    }
    case '유틸': {
      const heal = 6;
      S.player.hp = Math.min(S.player.maxHp, S.player.hp+heal);
      msg += `체력 +${heal} 회복.`;
      break;
    }
  }
  pushLog(msg);

  if(b.hp<=0){
    pushLog(`<span class="sys">◆ ${b.enemyName}을(를) 물리쳤다!</span>`);
    S.battle=null;
    S.screen = (S.keys.length>=3) ? 'shrine' : (S.travelChoicePending ? 'main' : 'main');
    render();
    return;
  }

  // 적 턴
  if(b.stunned){
    pushLog(`${b.enemyName}이(가) 기절해 움직이지 못한다.`);
    b.stunned=false;
  } else {
    let dmg = b.atk[0]+Math.floor(Math.random()*(b.atk[1]-b.atk[0]));
    if(b.atkDown>0){ dmg = Math.floor(dmg*0.6); b.atkDown--; }
    let absorbed = Math.min(S.player.shield, dmg);
    S.player.shield -= absorbed;
    dmg -= absorbed;
    S.player.hp = Math.max(0, S.player.hp-dmg);
    pushLog(`${b.enemyName}의 반격! <span class="dmg">${dmg} 피해</span>${absorbed>0?` (보호막이 ${absorbed} 흡수)`:''}`);
    if(S.player.hp<=0){
      pushLog(`<span class="sys">◆ 정신이 아득해진다... 가까스로 몸을 추스른다.</span>`);
      S.player.hp = Math.floor(S.player.maxHp*0.4);
      S.battle=null;
      S.screen='main';
    }
  }
  render();
}

function finalBoss(){
  S.battle = { enemyName:'흑막', hp:160, maxHp:160, atk:[14,22], stunned:false, atkDown:0, isFinal:true };
  S.screen='battle';
  pushLog(`<span class="dmg">⚔ 흑막이 그 형체를 드러낸다. 최후의 전투가 시작된다!</span>`);
  render();
}

/* 최종보스 승리는 useSkill 내부 공용 로직을 재사용하되, 종료 후 엔딩으로 분기 */
const _origUseSkill = useSkill;

/* ---------------------------- 슬롯 관리 ---------------------------- */

function equipToSlot(slotIdx, jobId){
  if(slotIdx>=maxSlots()) return;
  S.slots[slotIdx]=jobId;
  render();
}

/* ---------------------------- 렌더링 ---------------------------- */

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML='';

  if(S.screen==='title') return app.appendChild(renderTitle());
  if(S.screen==='intro') return app.appendChild(renderIntro());
  if(S.screen==='shrine') return app.appendChild(renderShrine());
  if(S.screen==='ending') return app.appendChild(renderEnding());

  // main / battle 공통 레이아웃
  const layout = document.createElement('div');
  layout.className='layout';
  layout.appendChild(renderSidebar());
  layout.appendChild(S.screen==='battle' ? renderBattle() : renderMain());
  app.appendChild(layout);
  const foot = el(`<footer>신의 은총 — 브레인스토밍 기획 프로토타입 · 임시 데이터는 README.md 참고</footer>`);
  app.appendChild(foot);
}

function renderTitle(){
  return el(`
    <div class="title-screen">
      <div class="eyebrow">1인 RPG · 기획 프로토타입</div>
      <h1>신의 은총</h1>
      <p>모든 죄를 뒤집어쓰고 낭떠러지에 던져진 자. 기억을 잃은 채 세 세계 중 한 곳에서 눈을 뜬다.
      천상 · 지상 · 지하, 삼각형으로 얽힌 세계의 무게중심에는 오래된 신전이 있다.</p>
      <button class="btn primary" onclick="startGame()">눈을 뜨다</button>
    </div>
  `);
}

function renderIntro(){
  return el(`
    <div class="title-screen">
      <div class="eyebrow">${S.spawnRegion} · 랜덤 스폰</div>
      <p class="narrative" style="max-width:560px;">${OPENING_TEXT[S.spawnRegion]}</p>
      <button class="btn primary" onclick="enterMain()">정신을 차리다</button>
    </div>
  `);
}

function renderSidebar(){
  const wrap = document.createElement('div');

  // 삼각형 맵
  const mapPanel = el(`<div class="panel map-wrap"><p class="panel-title">세계의 형태</p></div>`);
  mapPanel.appendChild(renderTriangleSVG());
  wrap.appendChild(mapPanel);

  // 상태
  const keyChips = REGIONS.map(r=>{
    const on = S.keys.includes(r);
    return `<div class="key-chip ${on?'on':''}" title="${r}">${on?'✦':'·'}</div>`;
  }).join('');

  const statsPanel = el(`
    <div class="panel">
      <p class="panel-title">상태</p>
      <div class="stat-row">
        <span class="label">체력</span>
        <div class="bar hp"><div style="width:${100*S.player.hp/S.player.maxHp}%"></div></div>
        <span class="stat-num mono">${S.player.hp}/${S.player.maxHp}</span>
      </div>
      ${S.player.shield>0?`
      <div class="stat-row">
        <span class="label">보호막</span>
        <div class="bar shield"><div style="width:${Math.min(100,S.player.shield*3)}%"></div></div>
        <span class="stat-num mono">${S.player.shield}</span>
      </div>`:''}
      <div style="margin-top:10px;">
        <span class="label" style="display:block; margin-bottom:6px;">은총 파편</span>
        <div class="key-row">${keyChips}</div>
      </div>
    </div>
  `);
  wrap.appendChild(statsPanel);

  // 직업 슬롯
  const slotsHtml = [0,1,2].map(i=>{
    const locked = i>=maxSlots();
    const jobId = S.slots[i];
    if(locked){
      return `<div class="slot empty"><div class="name">잠김</div><div class="region-tag">파편 ${i}개 필요</div></div>`;
    }
    const job = jobId ? jobById(jobId) : null;
    return `<div class="slot ${S.activeSlot===i?'active':''}" onclick="setActiveSlot(${i})">
      <div class="name">${job? job.id : '― 비어있음 ―'}</div>
      <div class="region-tag">${job? job.region+' 직업'+(HIDDEN_JOBS.includes(job)?' · 히든':'') : '아래에서 직업 선택'}</div>
      ${S.activeSlot===i?'<div class="active-tag">● 사용 중</div>':''}
    </div>`;
  }).join('');

  const slotPanel = el(`
    <div class="panel">
      <p class="panel-title">전투 직업 슬롯 (${maxSlots()}개 해금)</p>
      <div class="slots">${slotsHtml}</div>
    </div>
  `);
  wrap.appendChild(slotPanel);

  // 습득한 직업 목록 (슬롯에 배치)
  const learnedIds = Object.keys(S.learned);
  if(learnedIds.length){
    const rows = learnedIds.map(id=>{
      const job = jobById(id);
      const isHidden = HIDDEN_JOBS.includes(job);
      return `<button class="skill-btn" style="width:100%;" onclick="assignJob('${id}')">
        <span class="sk-name">${id}</span><span class="sk-type">${isHidden?'히든':'일반'} · ${job.region}</span>
      </button>`;
    }).join('');
    wrap.appendChild(el(`<div class="panel"><p class="panel-title">습득한 직업 (클릭해 현재 슬롯에 배치)</p>${rows}</div>`));
  }

  return wrap;
}

function setActiveSlot(i){
  if(i>=maxSlots()) return;
  S.activeSlot=i;
  render();
}
function assignJob(jobId){
  S.slots[S.activeSlot]=jobId;
  render();
}

function renderTriangleSVG(){
  const W=260,H=220;
  const top={x:W/2,y:20}, left={x:30,y:190}, right={x:W-30,y:190}, center={x:W/2,y:143};
  const coordsByRegion = {천상:top, 지상:left, 지하:right};
  const lines = [[top,left],[left,right],[right,top]].map(([a,b])=>{
    const done = S.keys.length>=1; // 신전 발견 이후 전체적으로 은은히 밝아짐
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${done?'#7a6a2e':'#2a2d3d'}" stroke-width="1.5"/>`;
  }).join('');

  const nodes = REGIONS.map(r=>{
    const p = coordsByRegion[r];
    const visited = S.visitOrder.includes(r);
    const current = S.currentRegion===r && S.screen!=='shrine';
    const keyed = S.keys.includes(r);
    const fill = keyed ? '#d4af37' : (visited ? REGION_META[r].hex : '#2a2d3d');
    return `
      <g>
        <circle cx="${p.x}" cy="${p.y}" r="${current?13:10}" fill="${fill}" stroke="${current?'#fff6da':'transparent'}" stroke-width="2"/>
        <text x="${p.x}" y="${p.y - (r==='천상'?20:-24)}" text-anchor="middle" class="node-label">${r}</text>
        <text x="${p.x}" y="${p.y - (r==='천상'?8:-36)}" text-anchor="middle" class="node-sub">${keyed?'파편 확보':(visited?'방문함':'미탐험')}</text>
      </g>`;
  }).join('');

  const shrineGlow = S.keys.length>0;
  const shrineNode = `
    <g>
      <circle cx="${center.x}" cy="${center.y}" r="7" fill="${shrineGlow?'#fff6da':'#191c2b'}" stroke="#d4af37" stroke-width="1.5"/>
      <text x="${center.x}" y="${center.y+22}" text-anchor="middle" class="node-sub">신전</text>
    </g>`;

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML = lines + nodes + shrineNode;
  return svg;
}

function renderMain(){
  const region = S.currentRegion;
  const steps = EXPLORE_STEPS[region];
  const canExplore = S.stepIndex < steps.length;
  const wrap = document.createElement('div');

  const header = el(`
    <div class="panel">
      <div class="region-title">
        <h2>${region}</h2>
        <span class="tag mono">탐험 진행 ${Math.min(S.stepIndex,steps.length)}/${steps.length}</span>
      </div>
      <p style="color:var(--parchment-dim); font-size:13px; margin:0 0 12px;">${REGION_META[region].desc}</p>
      <div class="bar progress" style="margin-bottom:14px;"><div style="width:${100*Math.min(S.stepIndex,steps.length)/steps.length}%"></div></div>
      <div class="btn-row" style="justify-content:flex-start;">
        <button class="btn primary" ${canExplore?'':'disabled'} onclick="doExplore()">탐험하다</button>
        <button class="btn" onclick="searchHidden()">숨겨진 흔적 조사</button>
      </div>
    </div>
  `);
  wrap.appendChild(header);

  if(S.travelChoicePending){
    const remaining = REGIONS.filter(r=>!S.visitOrder.includes(r));
    const btns = remaining.map(r=>`<button class="btn primary" onclick="travelTo('${r}')">${r}(으)로 이동</button>`).join('');
    wrap.appendChild(el(`
      <div class="panel">
        <p class="panel-title">신전의 힘 — 다음 목적지 선택</p>
        <p style="font-size:13px; color:var(--parchment-dim);">파편 하나를 손에 넣자, 신전으로 향하는 길이 두 갈래로 열렸다. 둘 중 하나만 지금 나아갈 수 있다.</p>
        <div class="btn-row" style="justify-content:flex-start;">${btns}</div>
      </div>
    `));
  }

  wrap.appendChild(el(`
    <div class="panel">
      <p class="panel-title">기록</p>
      <div class="log" id="logbox">${S.log.map(l=>`<p class="${l.cls}">${l.html}</p>`).join('')}</div>
    </div>
  `));

  setTimeout(()=>{ const lb=document.getElementById('logbox'); if(lb) lb.scrollTop=lb.scrollHeight; },0);
  return wrap;
}

function renderBattle(){
  const b = S.battle;
  const job = activeJob();
  const wrap = document.createElement('div');

  wrap.appendChild(el(`
    <div class="panel">
      <p class="panel-title">${b.isFinal?'최후의 전투':'전투'}</p>
      <div class="region-title"><h2>${b.enemyName}</h2></div>
      <div class="stat-row">
        <span class="label">적</span>
        <div class="bar enemy"><div style="width:${100*b.hp/b.maxHp}%"></div></div>
        <span class="stat-num mono">${b.hp}/${b.maxHp}</span>
      </div>
    </div>
  `));

  const skillsHtml = job ? job.skills.map(sk=>`
    <button class="skill-btn" onclick='useSkillByName(${JSON.stringify(job.id)}, ${JSON.stringify(sk.name)})'>
      <span class="sk-name">${sk.name}</span><span class="sk-type">${sk.type}</span>
      <div class="sk-desc">${sk.desc}</div>
    </button>
  `).join('') : `<p style="color:var(--parchment-dim); font-size:12px;">현재 슬롯에 장착된 직업이 없다. 왼쪽에서 슬롯을 눌러 직업을 배치하라.</p>`;

  wrap.appendChild(el(`
    <div class="panel">
      <p class="panel-title">사용 중인 직업 — ${job? job.id : '없음'}</p>
      <div class="skills">${skillsHtml}</div>
    </div>
  `));

  wrap.appendChild(el(`
    <div class="panel">
      <p class="panel-title">기록</p>
      <div class="log" id="logbox">${S.log.map(l=>`<p class="${l.cls}">${l.html}</p>`).join('')}</div>
    </div>
  `));

  setTimeout(()=>{ const lb=document.getElementById('logbox'); if(lb) lb.scrollTop=lb.scrollHeight; },0);
  return wrap;
}

function useSkillByName(jobId, skillName){
  const job = jobById(jobId);
  const sk = job.skills.find(s=>s.name===skillName);
  const wasFinal = S.battle && S.battle.isFinal;
  useSkill(sk);
  if(!S.battle && wasFinal){
    S.ending = true;
    S.screen='ending';
    render();
  }
}

function renderShrine(){
  return el(`
    <div class="title-screen">
      <div class="eyebrow">무게중심 · 중앙지점 신전</div>
      <h1 style="font-size:34px;">세 파편이 모이다</h1>
      <p style="max-width:520px;">세 세계에서 모은 「신의 은총」 파편 셋이 신전의 제단 위에서 공명한다.
      빛이 소용돌이치며 흑막을 옭아매던 봉인의 일부가 풀려나간다 — 그 힘이 이제, 흑막을 약화시킨다.
      흑막의 땅으로 향하는 길이 열렸다.</p>
      <button class="btn primary" onclick="finalBoss()">흑막의 땅으로 진입한다</button>
    </div>
  `);
}

function renderEnding(){
  return el(`
    <div class="title-screen">
      <div class="eyebrow">엔딩 (임시)</div>
      <h1 style="font-size:34px;">기억 저편에서</h1>
      <p style="max-width:560px; text-align:left; line-height:2;">
      흑막이 무너진다. 그러나 마지막 순간, 흑막은 알 수 없는 말을 남긴다 —
      "네가... 아직 살아있었나. 왕의 아들이."<br><br>
      「신의 은총」은 원래 왕족만이 다룰 수 있는 힘이었다. 당신이 지금까지 자유로이 파편들을 다룰 수 있었던 것은,
      우연이 아니라 당신의 핏줄 때문이었을지도 모른다.<br><br>
      기억은 여전히 돌아오지 않았다. 그러나 이제, 무엇을 찾아야 할지는 알 것 같다.
      </p>
      <p style="color:var(--parchment-dim); font-size:12px;">— 이번 회차 스폰: ${S.spawnRegion} · 방문 순서: ${S.visitOrder.join(' → ')} —</p>
      <button class="btn" onclick="location.reload()">처음부터 다시 시작</button>
    </div>
  `);
}

render();
</script>
</body>
</html>
